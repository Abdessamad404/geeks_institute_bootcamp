<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Challenge</title>
  </head>

  <body>
    <style>
      body {
        text-align: center;
      }

      #gifContainer {
        display: flex;
        flex-direction: row; 
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }

      #gifForm {
        margin: 10px;
      }

      .delete-btn {
        display: block;
        margin: 0 auto;
      }

      #deleteAllBtn {
        display: block;
        margin: 0 auto;
        margin-top: 10px;
        margin-bottom: 10px;
        padding: 5px 10px;
        background-color: #f00;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
    <h1>Daily Challenge</h1>
    <form id="gifForm">
      <input
        type="text"
        id="searchInput"
        placeholder="Enter a category..."
        required
      />
      <button type="submit">Search GIF</button>
    </form>
    <button id="deleteAllBtn">DELETE ALL</button>
    <div id="gifContainer"></div>
    <script src="challenges.js"></script>
  </body>
</html>
