<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drumset</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="drumset">
      <div class="pad" data-key="65">
        <audio data-key="65" src="sounds/boom.wav"></audio>
        <span class="key">A</span>
        <span class="label">Boom</span>
      </div>

      <div class="pad" data-key="83">
        <audio data-key="83" src="sounds/clap.wav"></audio>
        <span class="key">S</span>
        <span class="label">Clap</span>
      </div>

      <div class="pad" data-key="68">
        <audio data-key="68" src="sounds/hihat.wav"></audio>
        <span class="key">D</span>
        <span class="label">Hihat</span>
      </div>

      <div class="pad" data-key="70">
        <audio data-key="70" src="sounds/kick.wav"></audio>
        <span class="key">F</span>
        <span class="label">Kick</span>
      </div>

      <div class="pad" data-key="71">
        <audio data-key="71" src="sounds/openhat.wav"></audio>
        <span class="key">G</span>
        <span class="label">Openhat</span>
      </div>

      <div class="pad" data-key="72">
        <audio data-key="72" src="sounds/ride.wav"></audio>
        <span class="key">H</span>
        <span class="label">Ride</span>
      </div>

      <div class="pad" data-key="74">
        <audio data-key="74" src="sounds/snare.wav"></audio>
        <span class="key">J</span>
        <span class="label">Snare</span>
      </div>

      <div class="pad" data-key="75">
        <audio data-key="75" src="sounds/tink.wav"></audio>
        <span class="key">K</span>
        <span class="label">Tink</span>
      </div>

      <div class="pad" data-key="76">
        <audio data-key="76" src="sounds/tom.wav"></audio>
        <span class="key">L</span>
        <span class="label">Tom</span>
      </div>
    </div>
  </body>
</html>
