<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drumset</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="drumset">
      <div class="pad" data-key="a">
        <audio data-key="a" src="sounds/boom.wav"></audio>
        <span class="key">A</span>
        <span class="label">Boom</span>
      </div>

      <div class="pad" data-key="s">
        <audio data-key="s" src="sounds/clap.wav"></audio>
        <span class="key">S</span>
        <span class="label">Clap</span>
      </div>

      <div class="pad" data-key="d">
        <audio data-key="d" src="sounds/hihat.wav"></audio>
        <span class="key">D</span>
        <span class="label">Hihat</span>
      </div>

      <div class="pad" data-key="f">
        <audio data-key="f" src="sounds/kick.wav"></audio>
        <span class="key">F</span>
        <span class="label">Kick</span>
      </div>

      <div class="pad" data-key="g">
        <audio data-key="g" src="sounds/openhat.wav"></audio>
        <span class="key">G</span>
        <span class="label">Openhat</span>
      </div>

      <div class="pad" data-key="h">
        <audio data-key="h" src="sounds/ride.wav"></audio>
        <span class="key">H</span>
        <span class="label">Ride</span>
      </div>

      <div class="pad" data-key="j">
        <audio data-key="j" src="sounds/snare.wav"></audio>
        <span class="key">J</span>
        <span class="label">Snare</span>
      </div>

      <div class="pad" data-key="k">
        <audio data-key="k" src="sounds/tink.wav"></audio>
        <span class="key">K</span>
        <span class="label">Tink</span>
      </div>

      <div class="pad" data-key="l">
        <audio data-key="l" src="sounds/tom.wav"></audio>
        <span class="key">L</span>
        <span class="label">Tom</span>
      </div>
    </div>
  </body>
</html>
